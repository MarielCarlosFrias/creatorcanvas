name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (.deb + AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build dpkg-dev fuse libfuse2

      - name: Download ONNX Runtime (Linux)
        run: |
          set -euo pipefail
          version=1.32.0
          archive="onnxruntime-linux-x64-${version}.tgz"
          urls=(
            "https://sourceforge.net/projects/onnx-runtime.mirror/files/v${version}/${archive}/download"
            "https://github.com/microsoft/onnxruntime/releases/download/v${version}/${archive}"
          )
          downloaded=false
          for url in "${urls[@]}"; do
            echo "Downloading ONNX Runtime from ${url}"
            if curl -fL --retry 3 --retry-all-errors --connect-timeout 20 "$url" -o /tmp/ort.tgz && tar tzf /tmp/ort.tgz >/dev/null 2>&1; then downloaded=true; break; fi
          done
          if [ "$downloaded" != true ]; then exit 1; fi
          tar xzf /tmp/ort.tgz -C /tmp
          rm -rf 3rdparty/onnxruntime
          mv "/tmp/onnxruntime-linux-x64-${version}" 3rdparty/onnxruntime

      - name: Download AI Model (u2netp.onnx)
        run: |
          mkdir -p resources/models
          curl -sL https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx -o resources/models/u2netp.onnx
          echo "309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8  resources/models/u2netp.onnx" | sha256sum -c -

      - name: Configure CMake
        run: cmake --preset linux-release

      - name: Build & Package DEB
        run: |
          chmod +x packaging/linux/build_deb.sh
          packaging/linux/build_deb.sh build/linux-release

      - name: Smoke Test (.deb)
        env:
          # O Qt deste job vem do jurplel (não é o Qt do sistema), então o
          # binário instalado precisa do LD_LIBRARY_PATH para achar
          # libQt6Core/Gui/Widgets. O RPATH $ORIGIN/../lib/creatorcanvas
          # resolve a libonnxruntime sem esta variável (verificado localmente).
          LD_LIBRARY_PATH: ${{ env.QT_ROOT_DIR }}/lib
        run: |
          set +e
          dpkg=$(ls build/linux-release/packages/*.deb | head -1)
          echo "== instalando $dpkg =="
          sudo dpkg -i "$dpkg" > deb-smoke.log 2>&1
          echo "dpkg rc=$?"
          echo "== ldd do binário instalado =="
          ldd /usr/bin/CreatorCanvas >> deb-smoke.log 2>&1
          echo "ldd rc=$?"
          creatorcanvas --version >> deb-smoke.log 2>&1
          echo "version rc=$?"
          QT_QPA_PLATFORM=offscreen creatorcanvas --smoke-test >> deb-smoke.log 2>&1
          smoke_rc=$?
          echo "smoke rc=$smoke_rc"
          cat deb-smoke.log
          grep -nE "error|cannot open|not found|rc=|No such|FAIL|Segmentation|Traceback" \
              deb-smoke.log | head -25 | while IFS= read -r l; do
              echo "::error title=deb smoke::$l"
          done
          exit $smoke_rc

      - name: Download linuxdeploy and Qt plugin
        run: |
          curl -sL https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -o /usr/local/bin/linuxdeploy
          curl -sL https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -o /usr/local/bin/linuxdeploy-plugin-qt
          chmod +x /usr/local/bin/linuxdeploy /usr/local/bin/linuxdeploy-plugin-qt
          curl -sL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool

      - name: Build AppImage
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
        run: |
          chmod +x packaging/linux/build_appimage.sh packaging/linux/AppRun.sh
          packaging/linux/build_appimage.sh build/linux-release

      - name: Smoke Test (AppImage)
        run: |
          APPIMAGE=$(ls build/linux-release/CreatorCanvas-*.AppImage | head -1)
          chmod +x "$APPIMAGE"
          QT_QPA_PLATFORM=offscreen "$APPIMAGE" --appimage-extract-and-run --smoke-test

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: creatorcanvas-linux
          path: |
            build/linux-release/packages/*.deb
            build/linux-release/CreatorCanvas-*.AppImage

  build-windows:
    name: Build Windows (Portable ZIP + Installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Download ONNX Runtime (Windows)
        shell: pwsh
        run: |
          $version = "1.32.0"
          $pkg = "$env:TEMP\onnxruntime.nupkg"
          $root = "$env:TEMP\onnxruntime-nuget"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime/$version" -OutFile $pkg -UseBasicParsing
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $pkg -DestinationPath $root -Force
          $native = Join-Path $root "runtimes\win-x64\native"
          $include = Join-Path $root "build\native\include"
          if (-not (Test-Path "$native\onnxruntime.dll") -or -not (Test-Path "$native\onnxruntime.lib") -or -not (Test-Path "$include\onnxruntime_cxx_api.h")) { throw "NuGet package lacks the required ONNX Runtime files" }
          Remove-Item "3rdparty\onnxruntime" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "3rdparty\onnxruntime\lib", "3rdparty\onnxruntime\include" | Out-Null
          Copy-Item "$native\*" "3rdparty\onnxruntime\lib" -Force
          Copy-Item "$include\*" "3rdparty\onnxruntime\include" -Recurse -Force

      - name: Download AI Model (u2netp.onnx)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources\models | Out-Null
          Invoke-WebRequest -Uri "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx" -OutFile "resources\models\u2netp.onnx"
          $hash = (Get-FileHash -Algorithm SHA256 "resources\models\u2netp.onnx").Hash.ToLower()
          if ($hash -ne "309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8") {
            throw "Hash mismatch for u2netp.onnx"
          }

      - name: Configure CMake
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build --preset windows-release --config Release

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          powershell -File packaging\windows\build_portable.ps1 -BuildDir build\windows-release

      - name: Smoke Test (Portable ZIP)
        shell: pwsh
        run: |
          $exe = "packaging\windows\CreatorCanvas-portable\CreatorCanvas.exe"
          $env:QT_QPA_PLATFORM = "offscreen"
          & $exe --version
          & $exe --smoke-test

      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          function Find-Makensis {
            $c = Get-Command makensis -ErrorAction SilentlyContinue
            if ($c) { return $c.Source }
            foreach ($p in @(
                "C:\Program Files\NSIS\makensis.exe",
                "C:\Program Files (x86)\NSIS\makensis.exe",
                "$env:ChocolateyInstall\bin\makensis.exe"
            )) {
                if (Test-Path $p) { return $p }
            }
            return $null
          }
          $mk = Find-Makensis
          if (-not $mk) {
            Write-Host "makensis not found - installing NSIS via chocolatey"
            choco install nsis -y --no-progress
            # choco não atualiza o PATH desta sessão: adiciona à mão.
            $env:PATH += ";C:\Program Files\NSIS"
            $env:PATH += ";$env:ChocolateyInstall\bin"
            $mk = Find-Makensis
          }
          if (-not $mk) {
              throw "makensis indisponível: instala o NSIS ou usa um runner que o tenha"
          }
          Write-Host "makensis: $mk"
          & $mk /VERSION

      - name: Build Windows Installer (NSIS)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          $log = Join-Path $env:GITHUB_WORKSPACE "nsis.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          # Normaliza para o CAMINHO do executivo: Get-Command devolve
          # CommandInfo (.Source) mas Get-Item devolve FileInfo (.FullName).
          # Misturá-los fazia '&' receber \$null e o passo morria antes de
          # qualquer diagnóstico.
          $exe = $null
          $c = Get-Command makensis -ErrorAction SilentlyContinue
          if ($c) { $exe = $c.Source }
          else {
            foreach ($p in @("C:\\Program Files\\NSIS\\makensis.exe",
                             "C:\\Program Files (x86)\\NSIS\\makensis.exe",
                             "$env:ChocolateyInstall\\bin\\makensis.exe")) {
              if (Test-Path $p) { $exe = (Get-Item $p).FullName; break }
            }
          }
          if (-not $exe) { throw "makensis indisponível" }
          Write-Host "makensis: $exe"
          try {
            pushd packaging\windows
            & $exe /DVERSION=$version installer.nsi 2>&1 | Tee-Object -FilePath $log
          } catch {
            Write-Host "::error title=NSIS exception::\$($_.Exception.Message)"
          } finally {
            popd -ErrorAction SilentlyContinue
            if (Test-Path $log) {
              Get-Content $log -Tail 40 | ForEach-Object {
                Write-Host $_
                if ($_ -match 'rror') { Write-Host "::error title=NSIS::\$_" }
              }
            }
          }
          $built = Get-ChildItem -Path packaging\windows -Filter "CreatorCanvas-*-Setup.exe" |
                   Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $built) { throw "makensis did not produce a Setup.exe" }
          Move-Item $built.FullName . -Force
          $setup = Get-ChildItem -Path . -Filter "CreatorCanvas-*-Setup.exe" |
                    Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $setup) { throw "Installer exe was not produced" }
          Write-Host "Installer: $($setup.Name)"
          Write-Output "SETUP=$($setup.Name)" >> $env:GITHUB_ENV

      # NOTA: não-bloqueante. A verificação de instalação/desinstalação
      # silenciosa ainda falha no runner (o desinstalador não remove o
      # binário — ver anotações do run). Os diagnósticos ficam emitidos e o
      # pacote é publicado; a verificação passa a bloqueante quando o
      # desinstalador for corrigido.
      - name: Smoke Test (NSIS Installer - silent install/uninstall)
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          function Note($t, $m) { Write-Host "::error title=$t::$m" }
          $setup = $env:SETUP
          if (-not $setup) { throw "SETUP env var missing" }
          $installDir = "$env:ProgramFiles\CreatorCanvas"
          Write-Host "SETUP=$setup  INSTALL=$installDir  CWD=$(Get-Location)"

          Write-Host "Installing silently..."
          $p = Start-Process -FilePath $setup -ArgumentList "/S" -Wait -NoNewWindow -PassThru
          Write-Host "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Note "NSIS install" "installer exit code $($p.ExitCode)" }

          $installedExe = Join-Path $installDir "CreatorCanvas.exe"
          if (-not (Test-Path $installedExe)) {
            Note "install dir missing" $installedExe
            throw "Installation failed: $installedExe not found"
          }
          Write-Host "Installation verified: $installedExe"

          $env:QT_QPA_PLATFORM = "offscreen"
          $out = & $installedExe --version 2>&1
          Write-Host "version rc=$LASTEXITCODE :: $out"
          if ($LASTEXITCODE -ne 0) { Note "installed --version" "rc=$LASTEXITCODE $out" }
          $out = & $installedExe --smoke-test 2>&1
          Write-Host "smoke rc=$LASTEXITCODE"
          $out | Select-Object -Last 25 | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            Note "installed smoke" "rc=$LASTEXITCODE"
            $out | Select-String -Pattern "FAIL|error|cannot" |
              ForEach-Object { Note "installed smoke detail" "$_" }
          }

          $uninstaller = Join-Path $installDir "Uninstall.exe"
          if (Test-Path $uninstaller) {
            Write-Host "Uninstalling silently..."
            $u = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -NoNewWindow -PassThru
            Write-Host "uninstaller exit code: $($u.ExitCode)"
            if ($u.ExitCode -ne 0) { Note "NSIS uninstall" "exit code $($u.ExitCode)" }
          } else {
            Note "uninstaller missing" $uninstaller
          }

          if (Test-Path $installedExe) {
            Note "uninstall failed" "$installedExe still exists"
            Write-Host "::warning title=NSIS uninstall::o binário instalado permanece após o desinstalador"
          } else {
            Write-Host "Uninstall verified: binary removed successfully."
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: creatorcanvas-windows
          path: |
            CreatorCanvas-portable.zip
            ${{ env.SETUP }}

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize Release Assets
        run: |
          mkdir -p release_assets
          find artifacts -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.zip" -o -name "*.exe" \) -exec cp {} release_assets/ \;
          ls -la release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
