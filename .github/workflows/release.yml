name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (.deb + AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build dpkg-dev fuse libfuse2

      - name: Download ONNX Runtime (Linux)
        run: |
          curl -sL https://github.com/microsoft/onnxruntime/releases/download/v1.19.0/onnxruntime-linux-x64-1.19.0.tgz -o /tmp/ort.tgz
          echo "8627cae49b51544ed15bb70c8ecf25b187f22a301c99c1ced5f4f3af5c36b44c  /tmp/ort.tgz" | sha256sum -c -
          tar xzf /tmp/ort.tgz -C /tmp
          mv /tmp/onnxruntime-linux-x64-1.19.0 3rdparty/onnxruntime

      - name: Download AI Model (u2netp.onnx)
        run: |
          mkdir -p resources/models
          curl -sL https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx -o resources/models/u2netp.onnx
          echo "309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8  resources/models/u2netp.onnx" | sha256sum -c -

      - name: Configure CMake
        run: cmake --preset linux-release

      - name: Build & Package DEB
        run: |
          chmod +x packaging/linux/build_deb.sh
          packaging/linux/build_deb.sh build/linux-release

      - name: Smoke Test (.deb)
        env:
          # O Qt deste job vem do jurplel (não é o Qt do sistema), então o
          # binário instalado precisa do LD_LIBRARY_PATH para achar
          # libQt6Core/Gui/Widgets. O RPATH $ORIGIN/../lib/creatorcanvas
          # resolve a libonnxruntime sem esta variável (verificado localmente).
          LD_LIBRARY_PATH: ${{ env.QT_ROOT_DIR }}/lib
        run: |
          set +e
          dpkg=$(ls build/linux-release/packages/*.deb | head -1)
          echo "== instalando $dpkg =="
          sudo dpkg -i "$dpkg" > deb-smoke.log 2>&1
          echo "dpkg rc=$?"
          echo "== ldd do binário instalado =="
          ldd /usr/bin/CreatorCanvas >> deb-smoke.log 2>&1
          echo "ldd rc=$?"
          creatorcanvas --version >> deb-smoke.log 2>&1
          echo "version rc=$?"
          QT_QPA_PLATFORM=offscreen creatorcanvas --smoke-test >> deb-smoke.log 2>&1
          smoke_rc=$?
          echo "smoke rc=$smoke_rc"
          cat deb-smoke.log
          grep -nE "error|cannot open|not found|rc=|No such|FAIL|Segmentation|Traceback" \
              deb-smoke.log | head -25 | while IFS= read -r l; do
              echo "::error title=deb smoke::$l"
          done
          exit $smoke_rc

      - name: Download linuxdeploy and Qt plugin
        run: |
          curl -sL https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -o /usr/local/bin/linuxdeploy
          curl -sL https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -o /usr/local/bin/linuxdeploy-plugin-qt
          chmod +x /usr/local/bin/linuxdeploy /usr/local/bin/linuxdeploy-plugin-qt
          curl -sL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool

      - name: Build AppImage
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
        run: |
          chmod +x packaging/linux/build_appimage.sh packaging/linux/AppRun.sh
          packaging/linux/build_appimage.sh build/linux-release

      - name: Smoke Test (AppImage)
        run: |
          APPIMAGE=$(ls build/linux-release/CreatorCanvas-*.AppImage | head -1)
          chmod +x "$APPIMAGE"
          QT_QPA_PLATFORM=offscreen "$APPIMAGE" --appimage-extract-and-run --smoke-test

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: creatorcanvas-linux
          path: |
            build/linux-release/packages/*.deb
            build/linux-release/CreatorCanvas-*.AppImage

  build-windows:
    name: Build Windows (Portable ZIP + Installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Download ONNX Runtime (Windows)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v1.19.0/onnxruntime-win-x64-1.19.0.zip" -OutFile "$env:TEMP\ort.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "$env:TEMP\ort.zip").Hash.ToLower()
          if ($hash -ne "1d796da7001e4843858d0587aa8232976abf9e0ae7fba8deb7fa8156e440efb7") {
            throw "Hash mismatch for onnxruntime-win-x64-1.19.0.zip"
          }
          Expand-Archive -Path "$env:TEMP\ort.zip" -DestinationPath "$env:TEMP\ort"
          Move-Item "$env:TEMP\ort\onnxruntime-win-x64-1.19.0" "3rdparty\onnxruntime"

      - name: Download AI Model (u2netp.onnx)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources\models | Out-Null
          Invoke-WebRequest -Uri "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx" -OutFile "resources\models\u2netp.onnx"
          $hash = (Get-FileHash -Algorithm SHA256 "resources\models\u2netp.onnx").Hash.ToLower()
          if ($hash -ne "309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8") {
            throw "Hash mismatch for u2netp.onnx"
          }

      - name: Configure CMake
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build --preset windows-release --config Release

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          powershell -File packaging\windows\build_portable.ps1 -BuildDir build\windows-release

      - name: Smoke Test (Portable ZIP)
        shell: pwsh
        run: |
          $exe = "packaging\windows\CreatorCanvas-portable\CreatorCanvas.exe"
          $env:QT_QPA_PLATFORM = "offscreen"
          & $exe --version
          & $exe --smoke-test

      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          function Find-Makensis {
            $c = Get-Command makensis -ErrorAction SilentlyContinue
            if ($c) { return $c.Source }
            foreach ($p in @(
                "C:\Program Files\NSIS\makensis.exe",
                "C:\Program Files (x86)\NSIS\makensis.exe",
                "$env:ChocolateyInstall\bin\makensis.exe"
            )) {
                if (Test-Path $p) { return $p }
            }
            return $null
          }
          $mk = Find-Makensis
          if (-not $mk) {
            Write-Host "makensis not found - installing NSIS via chocolatey"
            choco install nsis -y --no-progress
            # choco não atualiza o PATH desta sessão: adiciona à mão.
            $env:PATH += ";C:\Program Files\NSIS"
            $env:PATH += ";$env:ChocolateyInstall\bin"
            $mk = Find-Makensis
          }
          if (-not $mk) {
              throw "makensis indisponível: instala o NSIS ou usa um runner que o tenha"
          }
          Write-Host "makensis: $mk"
          & $mk /VERSION

      - name: Build Windows Installer (NSIS)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          $log = Join-Path $env:GITHUB_WORKSPACE "nsis.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          $mk = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $mk) {
            foreach ($p in @("C:\\Program Files\\NSIS\\makensis.exe",
                             "C:\\Program Files (x86)\\NSIS\\makensis.exe",
                             "$env:ChocolateyInstall\\bin\\makensis.exe")) {
              if (Test-Path $p) { $mk = Get-Item $p; break }
            }
          }
          if (-not $mk) { throw "makensis indisponível" }
          Write-Host "makensis: $($mk.Source)"
          try {
            pushd packaging\windows
            & $mk.Source /DVERSION=$version installer.nsi 2>&1 | Tee-Object -FilePath $log
          } catch {
            Write-Host "::error title=NSIS exception::\$($_.Exception.Message)"
          } finally {
            popd -ErrorAction SilentlyContinue
            if (Test-Path $log) {
              Get-Content $log -Tail 40 | ForEach-Object {
                Write-Host $_
                if ($_ -match 'rror') { Write-Host "::error title=NSIS::\$_" }
              }
            }
          }
          $built = Get-ChildItem -Path packaging\windows -Filter "CreatorCanvas-*-Setup.exe" |
                   Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $built) { throw "makensis did not produce a Setup.exe" }
          Move-Item $built.FullName . -Force
          $setup = Get-ChildItem -Path . -Filter "CreatorCanvas-*-Setup.exe" |
                    Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $setup) { throw "Installer exe was not produced" }
          Write-Host "Installer: $($setup.Name)"
          Write-Output "SETUP=$($setup.Name)" >> $env:GITHUB_ENV

      - name: Smoke Test (NSIS Installer - silent install/uninstall)
        shell: pwsh
        run: |
          $setup = $env:SETUP
          if (-not $setup) { throw "SETUP env var missing" }
          $installDir = "$env:ProgramFiles\CreatorCanvas"

          # Silent install
          Write-Host "Installing silently..."
          Start-Process -FilePath $setup -ArgumentList "/S" -Wait -NoNewWindow

          # Verify installed binary exists
          $installedExe = Join-Path $installDir "CreatorCanvas.exe"
          if (-not (Test-Path $installedExe)) {
            throw "Installation failed: $installedExe not found"
          }
          Write-Host "Installation verified: $installedExe"

          # Smoke-test the installed binary
          $env:QT_QPA_PLATFORM = "offscreen"
          & $installedExe --version
          & $installedExe --smoke-test

          # Silent uninstall
          $uninstaller = Join-Path $installDir "Uninstall.exe"
          if (Test-Path $uninstaller) {
            Write-Host "Uninstalling silently..."
            Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -NoNewWindow
          }

          # Verify uninstall removed the binary
          if (Test-Path $installedExe) {
            throw "Uninstall failed: $installedExe still exists"
          }
          Write-Host "Uninstall verified: binary removed successfully."

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: creatorcanvas-windows
          path: |
            CreatorCanvas-portable.zip
            ${{ env.SETUP }}

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize Release Assets
        run: |
          mkdir -p release_assets
          find artifacts -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.zip" -o -name "*.exe" \) -exec cp {} release_assets/ \;
          ls -la release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false

