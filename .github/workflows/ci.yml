name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-22.04,  os: ubuntu-22.04,   preset: linux-debug }
          - { name: linux-24.04,  os: ubuntu-24.04,   preset: linux-debug }
          - { name: windows-msvc, os: windows-latest, preset: windows-debug }
          - { name: linux-asan,   os: ubuntu-24.04,   preset: linux-asan }
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Download ONNX Runtime (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sL https://github.com/microsoft/onnxruntime/releases/download/v1.19.0/onnxruntime-linux-x64-1.19.0.tgz -o /tmp/ort.tgz
          tar xzf /tmp/ort.tgz -C /tmp
          mv /tmp/onnxruntime-linux-x64-1.19.0 3rdparty/onnxruntime

      - name: Download ONNX Runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v1.19.0/onnxruntime-win-x64-1.19.0.zip" -OutFile "$env:TEMP\ort.zip"
          Expand-Archive -Path "$env:TEMP\ort.zip" -DestinationPath "$env:TEMP\ort"
          Move-Item "$env:TEMP\ort\onnxruntime-win-x64-1.19.0" "3rdparty\onnxruntime"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake --build --preset ${{ matrix.preset }} --config Debug
          else
            cmake --build --preset ${{ matrix.preset }}
          fi

      - name: Test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ctest --test-dir build/${{ matrix.preset }} -C Debug --output-on-failure
          else
            ctest --test-dir build/${{ matrix.preset }} --output-on-failure
          fi
