name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-22.04,  os: ubuntu-22.04,   preset: linux-debug }
          - { name: linux-24.04,  os: ubuntu-24.04,   preset: linux-debug }
          - { name: windows-msvc, os: windows-latest, preset: windows-debug }
          - { name: linux-asan,   os: ubuntu-24.04,   preset: linux-asan }
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        # icc-profiles-free supplies sRGB.icc and
        # compatibleWithAdobeRGB1998.icc used by test_icc. Without an explicit
        # dependency, ICC tests depend on whatever the hosted image contains.
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsfml-dev icc-profiles-free

      - name: Download ONNX Runtime (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          version=1.32.0
          archive="onnxruntime-linux-x64-${version}.tgz"
          urls=(
            "https://sourceforge.net/projects/onnx-runtime.mirror/files/v${version}/${archive}/download"
            "https://github.com/microsoft/onnxruntime/releases/download/v${version}/${archive}"
          )
          downloaded=false
          for url in "${urls[@]}"; do
            echo "Downloading ONNX Runtime from ${url}"
            if curl -fL --retry 3 --retry-all-errors --connect-timeout 20 "$url" -o /tmp/ort.tgz; then
              if tar tzf /tmp/ort.tgz >/dev/null 2>&1; then
                downloaded=true
                break
              fi
              echo "Response was not a valid tar archive; trying next mirror"
            fi
          done
          if [ "$downloaded" != true ]; then
            echo "Unable to download a valid ONNX Runtime archive" >&2
            exit 1
          fi
          tar xzf /tmp/ort.tgz -C /tmp
          rm -rf 3rdparty/onnxruntime
          mv "/tmp/onnxruntime-linux-x64-${version}" 3rdparty/onnxruntime

      - name: Download ONNX Runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "1.32.0"
          $pkg = "$env:TEMP\onnxruntime.nupkg"
          $root = "$env:TEMP\onnxruntime-nuget"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime/$version" -OutFile $pkg -UseBasicParsing
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $pkg -DestinationPath $root -Force
          $native = Join-Path $root "runtimes\win-x64\native"
          $include = Join-Path $root "build\native\include"
          if (-not (Test-Path "$native\onnxruntime.dll") -or -not (Test-Path "$native\onnxruntime.lib") -or -not (Test-Path "$include\onnxruntime_cxx_api.h")) { throw "NuGet package lacks the required ONNX Runtime files" }
          Remove-Item "3rdparty\onnxruntime" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "3rdparty\onnxruntime\lib", "3rdparty\onnxruntime\include" | Out-Null
          Copy-Item "$native\*" "3rdparty\onnxruntime\lib" -Force
          Copy-Item "$include\*" "3rdparty\onnxruntime\include" -Recurse -Force

      # SFML builds the bundled MiniPaint editor (Image > Edit in MiniPaint),
      # so the Windows job compiles it too via the official prebuilt SDK.
      - name: Install SFML 3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.sfml-dev.org/files/SFML-3.0.0-windows-vc17-64-bit.zip" -OutFile "$env:TEMP\sfml.zip"
          Expand-Archive -Path "$env:TEMP\sfml.zip" -DestinationPath "C:\sfml"
          $sfml = (Get-ChildItem "C:\sfml" -Directory | Select-Object -First 1).FullName
          "SFML_ROOT=$sfml" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=$sfml\lib\cmake\SFML" >> $env:GITHUB_ENV
          Write-Host "SFML installed at $sfml"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake --build --preset ${{ matrix.preset }} --config Debug --parallel 2
          else
            cmake --build --preset ${{ matrix.preset }}
          fi

      - name: Diagnose Linux fonts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          fc-match "Sans Serif"
          fc-match sans-serif
          fc-list | head -20

      - name: Test
        shell: bash
        run: |
          set +e
          if [ "${{ runner.os }}" = "Windows" ]; then
            ctest --test-dir build/${{ matrix.preset }} -C Debug --output-on-failure > ctest.log 2>&1
          else
            ctest --test-dir build/${{ matrix.preset }} --output-on-failure > ctest.log 2>&1
          fi
          rc=$?
          set -e
          cat ctest.log
          if [ "$rc" -ne 0 ]; then
            # Anotações ficam visíveis na API sem autenticação: a falha passa
            # a ser diagnosticável (antes só havia "exit code 8").
            failed=$(sed -n '/The following tests FAILED/,/^$/p' ctest.log \
                       | grep -oE '[0-9]+ - [A-Za-z0-9_]+' \
                       | sed 's/^[0-9]* - //' | paste -sd, - )
            echo "::error title=Testes falharam (rc=$rc)::${failed:-nomes indisponiveis}"
            # Relatório sanitizer COMPLETO (alocação/libertação = a prova) e
            # linhas de falha do QtTest. Anotações aceitam múltiplas linhas,
            # então o dump inteiro cabe numa única anotação.
            {
              sed -n '/==.*==ERROR: /,/^==.*==ABORTING/p' ctest.log | head -45
              grep -hE 'FAIL!|Totals: .*failed|runtime error:' ctest.log | head -10
            } | while IFS= read -r l; do echo "::error title=Relatorio da falha::$l"; done
          fi
          exit $rc

      # Sempre publica o relatório: com `if: failure()` os logs ficam
      # anexados ao run e a falha passa a ser diagnosticável sem precisar
      # de token (antes só dava para ver "exit code 8" nas anotações).
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.preset }}
          path: |
            ctest.log
            build/${{ matrix.preset }}/Testing/Temporary/
            build/${{ matrix.preset }}/tests/*.log
          if-no-files-found: warn
          retention-days: 7
